# Git Dojo — site estático servido pelo Nginx da VPS Contabo (169.58.43.129).
# Arquivo de origem: deploy/nginx-gitdojo.conf no repositório; instalado em
# /etc/nginx/sites-available/gitdojo.conf (link em sites-enabled). O HTTPS é
# adicionado pelo Certbot depois que o DNS do domínio apontar para a VPS:
#   sudo certbot --nginx -d gitdojo.rpatecnologia.com.br

server {
    listen 80;
    listen [::]:80;
    server_name gitdojo.rpatecnologia.com.br;

    root /var/www/gitdojo/public;
    index index.html;
    charset utf-8;

    # Um login e senha por dev (decisão do Rodrigo, 08/11/2026). Para incluir alguém:
    #   echo "login:$(openssl passwd -apr1)" | sudo tee -a /etc/nginx/gitdojo.htpasswd
    auth_basic "Git Dojo - Iron Systems";
    auth_basic_user_file /etc/nginx/gitdojo.htpasswd;

    # O desafio do Certbot precisa passar sem senha.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
    }

    access_log /var/log/nginx/gitdojo-access.log;
    error_log  /var/log/nginx/gitdojo-error.log;

    # O Dojo não chama nenhum serviço externo: fontes, vídeos e legendas vêm do próprio build.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # As legendas .vtt não constam do mime.types padrão do Ubuntu.
    types {
        text/vtt vtt;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/vtt text/plain image/svg+xml application/json;

    # index.html muda a cada publicação e aponta para os assets com hash: nunca guardar.
    location = /index.html {
        expires -1;
    }

    # Assets com hash no nome (JS, CSS, fontes): podem ficar um ano no cache do navegador.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Vídeos (MP4 de ~3 MB, servidos com Range pelo próprio Nginx), pôsteres e legendas.
    location /videos/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }
}
