# Git Dojo — site estático servido pelo Nginx da VPS Contabo (169.58.43.129).
# Arquivo de origem: deploy/nginx-gitdojo.conf no repositório; instalado em
# /etc/nginx/sites-available/gitdojo.conf (link em sites-enabled). Os blocos "managed by Certbot"
# foram acrescentados em 08/11/2026 pelo Certbot (HTTPS e redirecionamento de HTTP para HTTPS).
# Depende de /etc/nginx/conf.d/gitdojo-limits.conf (zona do limit_req e formato do log), cópia de
# deploy/nginx-gitdojo-limits.conf.

server {
    server_name gitdojo.rpatecnologia.com.br;

    root /var/www/gitdojo/public;
    index index.html;
    charset utf-8;

    # Tela de login (Etapa 1H, 08/11/2026). Todo pedido passa antes por /_auth/check (check.php), que
    # confere o cookie assinado da sessão; com 401, /_auth/entrar manda o navegador para /login/?volta=...
    # Ficam livres sem login só /login/, /_auth/login, /_auth/logout, /_auth/me e o desafio do Certbot.
    # O cadastro continua em /etc/nginx/gitdojo.htpasswd, lido pelos scripts de /var/www/gitdojo/auth/.
    # Para incluir alguém: echo "login:$(openssl passwd -apr1)" | sudo tee -a /etc/nginx/gitdojo.htpasswd
    auth_request /_auth/check;
    auth_request_set $dojo_usuario $upstream_http_x_dojo_usuario;
    error_page 401 = /_auth/entrar;

    # O desafio do Certbot precisa passar sem login.
    location ^~ /.well-known/acme-challenge/ {
        auth_request off;
    }

    access_log /var/log/nginx/gitdojo-access.log gitdojo;
    error_log  /var/log/nginx/gitdojo-error.log;

    # O Dojo não chama nenhum serviço externo: fontes, vídeos e legendas vêm do próprio build.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # As legendas .vtt não constam do mime.types padrão do Ubuntu.
    types {
        text/vtt vtt;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/vtt text/plain image/svg+xml application/json;

    # ---------- login ----------

    # Tela de login (deploy/login/, copiada para dentro do build pelo hook). Nunca guardar no cache.
    location ^~ /login/ {
        auth_request off;
        expires -1;
        try_files $uri $uri/ =404;
    }
    location = /login {
        auth_request off;
        return 301 /login/;
    }

    # Subrequisição do auth_request: 204 com sessão válida, 401 sem.
    location = /_auth/check {
        internal;
        auth_request off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gitdojo/auth/check.php;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Destino interno do 401: responde 303 para /login/?volta=<pedido original>.
    location = /_auth/entrar {
        internal;
        auth_request off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gitdojo/auth/login.php;
        fastcgi_param DOJO_ACAO entrar;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Formulário de login: 10 tentativas por minuto por IP, com folga de 5; o excesso recebe 429.
    location = /_auth/login {
        auth_request off;
        limit_req zone=gitdojo_login burst=5 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gitdojo/auth/login.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /_auth/logout {
        auth_request off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gitdojo/auth/logout.php;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Usado pelo botão "Sair" do Dojo; o próprio me.php confere a sessão e responde JSON ou 401.
    location = /_auth/me {
        auth_request off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gitdojo/auth/me.php;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # ---------- Dojo (protegido pelo auth_request acima) ----------

    # index.html muda a cada publicação e aponta para os assets com hash: nunca guardar.
    location = /index.html {
        expires -1;
    }

    # Assets com hash no nome (JS, CSS, fontes): podem ficar um ano no cache do navegador.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Vídeos (MP4 de ~3 MB, servidos com Range pelo próprio Nginx), pôsteres e legendas.
    location /videos/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gitdojo.rpatecnologia.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gitdojo.rpatecnologia.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = gitdojo.rpatecnologia.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gitdojo.rpatecnologia.com.br;
    return 404; # managed by Certbot


}
