# Git Dojo — definições no nível http usadas pelo vhost gitdojo.conf (Etapa 1H, tela de login).
# Arquivo de origem: deploy/nginx-gitdojo-limits.conf no repositório; instalado em
# /etc/nginx/conf.d/gitdojo-limits.conf.

# Tentativas de login: 10 por minuto por IP (o vhost dá folga de 5 e responde 429 ao excesso).
limit_req_zone $binary_remote_addr zone=gitdojo_login:10m rate=10r/m;

# Log de acesso com o usuário da sessão no lugar de $remote_user, que ficava preenchido com o auth_basic.
# $dojo_usuario vem do cabeçalho X-Dojo-Usuario do check.php (auth_request_set no vhost); "-" sem sessão.
log_format gitdojo '$remote_addr - $dojo_usuario [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';
